#bDel{background:#666}#bClr{background:#933}#bSpk{background:#2a9d8f;font-size:14px;padding:0 10px;font-weight:800}#bQP{background:#e9c46a;color:#333;font-size:16px;padding:0 8px}

.c.edit-mode{cursor:crosshair}

function handleEditPhoto(input){

reader.onload=function(e){

img.onload=function(){

if(w>h){if(w>MAX){h=h*(MAX/w);w=MAX}}else{if(h>MAX){w=w*(MAX/h);h=MAX}}
const canvas=document.createElement('canvas');

};

};

}

function sayInfo(field){
const phrases={
name: myInfo.name ? 'My name is '+myInfo.name : 'My name is not set yet',
address: myInfo.address ? 'I live at '+myInfo.address : 'My address is not set yet',
city: myInfo.city ? 'I live in '+myInfo.city : 'My city is not set yet',

phone: myInfo.phone ? 'Call my parent at '+myInfo.phone.split('').join(' ') : 'Parent phone is not set yet',
emergency: myInfo.emergency ? myInfo.emergency : 'No emergency info set'
};
const text=phrases[field]||'';
if(text){
sentence=text.split(' ').map(w=>({w,i:0}));
rStrip();
speak(text);
}
}

function speak(text){text=(text+'').toLowerCase();if(!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=SP;if(VU){const v=speechSynthesis.getVoices().find(v=>v.voiceURI===VU);if(v)u.voice=v}speechSynthesis.speak(u)}

function rStrip(){const c=document.getElementById('sW');c.innerHTML='';sentence.forEach(s=>{const d=document.createElement('div');d.className='sw';if(s.i){d.innerHTML=`<img src="${IM(s.i)}" style="${isMul(IM(s.i))?'':'filter:brightness(0) invert(1)'}" onerror="this.style.display='none'"><span>${s.w}</span>`}else{d.innerHTML=`<span style="font-size:11px;color:#fff">${s.w}</span>`}d.onclick=()=>speak(s.w);c.appendChild(d)});if(spellBuf){const sb=document.createElement('div');sb.className='sw';sb.style.background='#2a6f97';sb.innerHTML=`<span style="font-size:12px;color:#fff;font-weight:700">${spellBuf}▌</span>`;c.appendChild(sb)}c.scrollLeft=c.scrollWidth}

function gram(sfx){if(!sentence.length)return;const last=sentence[sentence.length-1];last.w=last.w+sfx;rStrip();speak(last.w)}

d.innerHTML=`<div style="font-size:clamp(14px,4vw,24px);font-weight:900">${k}</div><div class="lb">${k}</div>`;
d.onclick=()=>{spellBuf+=k;speak(k);rStrip();d.classList.add('pulse');setTimeout(()=>d.classList.remove('pulse'),300)};b.appendChild(d)});
}
function getHome(){const all=V.sort((a,b)=>a.p-b.p);if(!phoneMode)return all;return PHONE_CORE.map(p=>all.find(v=>v.p===p)).filter(Boolean)}
function getFringe(cat){
const catColors={food:'resp',people:'prow_a',feelings:'prow_d',places:'prow_c',animals:'prow_a',things:'prow_c',colors:'social',body:'prow_d',clothes:'social'};
return(FR[cat]||[]).map(([w,svgName])=>({w,svgName,i:0,t:catColors[cat]||'resp'}));
}
function getCustom(){return customWords.map(c=>({w:c.w,i:c.i||0,t:c.t||'resp',photo:c.photo||null}))}

function goHome(){curView='home';const w=spellBuf.trim();if(w){sentence.push({w,i:0});speak(w)}spellBuf='';render();rStrip();document.getElementById('backBtn').style.display='none'}

// === RECENTS ===
function renderRec(){const rb=document.getElementById('recentsBar');if(!showRec){rb.style.display='none';return}rb.style.display='flex';rb.innerHTML='';recents.slice(0,8).forEach(s=>{const d=document.createElement('div');d.className='rc';d.innerHTML=`<img src="${IM(s.i)}" style="${isMul(IM(s.i))?'':'filter:brightness(0) invert(1)'}" onerror="this.style.display='none'"><span>${s.w}</span>`;d.onclick=()=>addWord(s.w,s.i);rb.appendChild(d)})}
function toggleRec(){showRec=!showRec;renderRec()}
function togglePhone(){phoneMode=!phoneMode;const btn=document.getElementById('phoneToggle');btn.textContent=phoneMode?'FULL':'SIMPLE';btn.className=phoneMode?'active':'';save();if(curView==='home')render()}

// === PIN ===
let pinBuf='';
function openPin(){pinBuf='';pinCallback=null;document.getElementById('pinErr').textContent='';updDots();document.getElementById('pinOv').classList.add('open')}
function closePin(){document.getElementById('pinOv').classList.remove('open');pinBuf=''}
function pinKey(k){if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);document.getElementById('pinErr').textContent=''}else if(pinBuf.length<4){pinBuf+=k;if(pinBuf.length===4){if(pinBuf===PIN){closePin();if(pinCallback){pinCallback();pinCallback=null}else{openSet()}}else{document.getElementById('pinErr').textContent='Wrong PIN';const d=document.getElementById('pinDots');d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),400);pinBuf=''}}}updDots()}
function updDots(){document.querySelectorAll('#pinDots .pin-dot').forEach((d,i)=>d.classList.toggle('filled',i<pinBuf.length))}

// === SETTINGS ===
function openSet(){document.getElementById('setOv').classList.add('open');populateVoices();document.getElementById('spR').value=SP;document.getElementById('mmSel').value=MM?'1':'0';document.getElementById('modelBanner').style.display=MM?'block':'none';loadInfo();renderStats();renderCWList()}
function closeOv(id){document.getElementById(id).classList.remove('open')}
function populateVoices(){const sel=document.getElementById('vSel');const voices=speechSynthesis.getVoices();sel.innerHTML=voices.map(v=>`<option value="${v.voiceURI}" ${v.voiceURI===VU?'selected':''}>${v.name}</option>`).join('');sel.onchange=()=>{VU=sel.value;save()}}
function renderStats(){const box=document.getElementById('statsBox');const total=Object.values(usage).reduce((a,b)=>a+b,0);const sorted=Object.entries(usage).sort((a,b)=>b[1]-a[1]).slice(0,5);const allWords=V.filter(v=>!v.cat&&v.w!=='CLEAR'&&!v.w.startsWith('+'));const usedW=allWords.filter(v=>usage[v.w]>0).length;const pct=allWords.length?Math.round(usedW/allWords.length*100):0;
box.innerHTML=`<div class="stat-row"><span>Total taps</span><b>${total}</b></div><div class="stat-row"><span>Unique words</span><b>${Object.keys(usage).length}</b></div><div class="stat-row"><span>Coverage</span><b>${pct}%</b></div>${sorted.map(([w,c])=>`<div class="stat-row"><span>${w}</span><b>${c}×</b></div>`).join('')}`}

// === CUSTOM WORDS ===
function renderCWList(){const el=document.getElementById('cwList');if(!customWords.length){el.innerHTML='<p style="font-size:.75em;opacity:.5">No custom words yet</p>';return}el.innerHTML=customWords.map((c,i)=>`<div class="cw-item"><span>${c.w}</span><button class="dn" onclick="delCW(${i})" style="padding:2px 8px;font-size:.7em">✕</button></div>`).join('')}
let cwPhotoData=null;
function handleCWPhoto(input){
if(!input.files||!input.files[0])return;
const file=input.files[0];
const reader=new FileReader();
reader.onload=function(e){
// Resize to 120x120 max for localStorage efficiency
const img=new Image();
img.onload=function(){
const MAX=120;
let w=img.width,h=img.height;
if(w>h){if(w>MAX){h=h*(MAX/w);w=MAX}}else{if(h>MAX){w=w*(MAX/h);h=MAX}}
const canvas=document.createElement('canvas');
canvas.width=w;canvas.height=h;
const ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0,w,h);
cwPhotoData=canvas.toDataURL('image/jpeg',0.8);
document.getElementById('cwPreview').innerHTML=`<img src="${cwPhotoData}" style="width:60px;height:60px;border-radius:8px;object-fit:cover;border:2px solid #2a9d8f"><br><span style="font-size:.65em;color:#aaa">Photo added</span>`;
};
img.src=e.target.result;
};
reader.readAsDataURL(file);
}
function openAddCW(){document.getElementById('cwWord').value='';document.getElementById('cwAra').value='';cwPhotoData=null;document.getElementById('cwPreview').innerHTML='';document.getElementById('cwOv').classList.add('open')}
function saveCW(){const w=document.getElementById('cwWord').value.trim();if(!w)return;const t=document.getElementById('cwCat').value;const ara=document.getElementById('cwAra').value.trim();customWords.push({w,t,i:ara?parseInt(ara):0,photo:cwPhotoData||null});cwPhotoData=null;save();closeOv('cwOv');renderCWList()}
function delCW(i){customWords.splice(i,1);save();renderCWList()}

// === QUICK PHRASES ===
function openQP(){const g=document.getElementById('qpGrid');g.innerHTML=QP.map(([phrase])=>`<button class="qp-btn" onclick="sayPhrase('${phrase.replace(/'/g,"\\'")}')">${phrase}</button>`).join('');document.getElementById('qpOv').classList.add('open')}
function sayPhrase(p){speak(p);closeOv('qpOv')}

// === TUTORIAL ===
const TUT=[{e:'🗣️',h:'Welcome to My Buddy!',p:'Tap any word to hear it spoken. Build your child\'s language one word at a time.'},{e:'📝',h:'Build Sentences',p:'Tap multiple words to build a sentence. Then press SPEAK to say it all together.'},{e:'⚙️',h:'Parents: Settings',p:'Tap ⚙️ to adjust voice, speed, and add custom words. Default PIN: 1234'}];
let tutStep=0;
function showTut(){tutStep=0;rTut();document.getElementById('tutOv').style.display='flex'}
function rTut(){const s=TUT[tutStep];document.getElementById('tutE').textContent=s.e;document.getElementById('tutH').textContent=s.h;document.getElementById('tutP').textContent=s.p;document.getElementById('tutD').innerHTML=TUT.map((_,i)=>`<div class="tut-d ${i===tutStep?'on':''}"></div>`).join('');document.getElementById('tutBtn').textContent=tutStep===TUT.length-1?"Got it! 🚀":"Next"}
function tutNext(){if(tutStep<TUT.length-1){tutStep++;rTut()}else{document.getElementById('tutOv').style.display='none';save()}}

// === INIT ===
function init(){
const tutDone=load();
const ptBtn=document.getElementById('phoneToggle');if(ptBtn){ptBtn.textContent=phoneMode?'FULL':'SIMPLE';if(phoneMode)ptBtn.classList.add('active')}
document.getElementById('pinPad').innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k===''?'<button class="nk empty"></button>':k==='⌫'?`<button class="nk" onclick="pinKey('⌫')">⌫</button>`:`<button class="nk" onclick="pinKey('${k}')">${k}</button>`).join('');
render();renderRec();
window.addEventListener('resize',render);
speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=populateVoices;
setTimeout(()=>{const sp=document.getElementById('splash');sp.classList.add('gone');setTimeout(()=>{sp.remove();if(!tutDone)showTut()},500)},800);
}

document.body.insertAdjacentHTML('beforeend','<div class="tut-ov" id="tutOv" style="display:none"><div class="tut-card"><div class="tut-emoji" id="tutE"></div><div class="tut-h" id="tutH"></div><div class="tut-p" id="tutP"></div><div class="tut-dots" id="tutD"></div><button class="tut-btn" id="tutBtn" onclick="tutNext()">Next</button></div></div>');

init();
</script></body></html>
