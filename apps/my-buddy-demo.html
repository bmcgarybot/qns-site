function sayInfo(field){
const phrases={
name: myInfo.name ? 'My name is '+myInfo.name : 'My name is not set yet',
address: myInfo.address ? 'I live at '+myInfo.address : 'My address is not set yet',
city: myInfo.city ? 'I live in '+myInfo.city : 'My city is not set yet',
school: myInfo.school ? 'I go to '+myInfo.school : 'My school is not set yet',

};
const text=phrases[field]||'';
if(text){
sentence=text.split(' ').map(w=>({w,i:0}));
rStrip();
speak(text);
}
}

function save(){try{localStorage.setItem(SK,JSON.stringify({LV,GC,SP,VU,MM,PIN,recents,usage,customWords,myInfo,tutDone:true}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SK)||'{}');LV=d.LV||1;GC=d.GC||7;SP=d.SP||.9;VU=d.VU||'';MM=d.MM||false;PIN=d.PIN||'1234';recents=d.recents||[];usage=d.usage||{};customWords=d.customWords||[];myInfo=d.myInfo||{name:'',address:'',city:'',school:'',phone:'',emergency:''};return d.tutDone}catch(e){return false}}

function speak(text){text=(text+'').toLowerCase();if(!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=SP;if(VU){const v=speechSynthesis.getVoices().find(v=>v.voiceURI===VU);if(v)u.voice=v}speechSynthesis.speak(u)}
function addWord(w,i){if(spellBuf){const sw=spellBuf.trim();if(sw){sentence.push({w:sw,i:0});speak(sw)}spellBuf=''}sentence.push({w,i});rStrip();speak(w);if(!MM){usage[w]=(usage[w]||0)+1;recents=recents.filter(r=>r.w!==w);recents.unshift({w,i});if(recents.length>20)recents.length=20}save();renderRec()}
function rStrip(){const c=document.getElementById('sW');c.innerHTML='';sentence.forEach(s=>{const d=document.createElement('div');d.className='sw';if(s.i){d.innerHTML=`<img src="${IM(s.i)}" style="filter:brightness(0) invert(1)" onerror="this.style.display='none'"><span>${s.w}</span>`}else{d.innerHTML=`<span style="font-size:11px;color:#fff">${s.w}</span>`}d.onclick=()=>speak(s.w);c.appendChild(d)});if(spellBuf){const sb=document.createElement('div');sb.className='sw';sb.style.background='#2a6f97';sb.innerHTML=`<span style="font-size:12px;color:#fff;font-weight:700">${spellBuf}▌</span>`;c.appendChild(sb)}c.scrollLeft=c.scrollWidth}
function sDel(){if(spellBuf){spellBuf=spellBuf.slice(0,-1);rStrip();return}if(sentence.length){sentence.pop();rStrip()}}
function sClr(){sentence=[];spellBuf='';rStrip()}
function sSpk(){if(spellBuf.trim()){sentence.push({w:spellBuf.trim(),i:0});spellBuf='';rStrip()}if(sentence.length)speak(sentence.map(s=>s.w).join(' '))}
function gram(sfx){if(!sentence.length)return;const last=sentence[sentence.length-1];last.w=last.w+sfx;rStrip();speak(last.w)}

function isPhone(){return window.innerWidth<=500||(window.innerWidth<=850&&window.innerHeight<=500)}
function getPhoneCols(){
const landscape=window.innerWidth>window.innerHeight;
return landscape?6:4;
}
function getPhoneRows(){
const landscape=window.innerWidth>window.innerHeight;
return landscape?3:5;
}
// Priority words for iPhone home — must fit on one screen
const PHONE_PRIORITY=['I','you','want','go','help','more','yes','no','stop','eat','drink','play','like','look','open','all done','food','people','feelings','my words','ABC'];
function getPhoneHome(){
const phone=isPhone();
if(!phone)return null;
const maxCells=getPhoneCols()*getPhoneRows();
const pWords=PHONE_PRIORITY.slice(0,maxCells);
const result=[];
for(const pw of pWords){
const item=V.find(v=>v.w===pw);
if(item)result.push(item);
}
return result;
}
function render(){
const b=document.getElementById('board');
if(curView==='spell'){renderSpell(b);return}
const phone=isPhone();
let items;
if(curView==='home'&&phone){
items=getPhoneHome()||getHome();
}else if(curView==='home'){
items=getHome();
}else if(curView==='custom'){
items=getCustom();
}else{
items=getFringe(curView);
}
const cols=phone?getPhoneCols():GC;
const rows=phone?getPhoneRows():Math.max(Math.ceil(items.length/cols),2);
b.style.gridTemplateColumns=`repeat(${cols},1fr)`;
b.style.gridTemplateRows=`repeat(${rows},1fr)`;
b.style.overflow='hidden';
b.innerHTML='';
items.forEach(s=>{const d=document.createElement('div');d.className='c '+(s.t||'core');
const imgSrc=s.photo?s.photo:(s.svgName?'symbols/mybuddy/'+s.svgName+'.svg':(s.i?IM(s.i):null));
if(imgSrc){
d.innerHTML=`<img src="${imgSrc}" style="${s.photo?'border-radius:6px;object-fit:cover;':''}filter:brightness(0) invert(1);"
 onerror="this.style.filter='';this.onerror=null"><div class="lb">${s.w}</div>`;
}else{
d.innerHTML=`<div class="lb" style="font-size:clamp(12px,3vw,18px)">${s.w}</div>`;
}
d.onclick=()=>{if(s.cat){curView=s.cat;render();document.getElementById('backBtn').style.display='block';return}addWord(s.w,s.i);d.classList.add('pulse');setTimeout(()=>d.classList.remove('pulse'),300)};b.appendChild(d)})}
function renderSpell(b){
b.style.gridTemplateColumns='repeat(10,1fr)';b.style.gridTemplateRows='repeat(5,1fr)';b.innerHTML='';
SPELL_KEYS.forEach(row=>{row.forEach(k=>{const d=document.createElement('div');d.className='c misc';
d.style.background='#3d405b';d.innerHTML=`<div style="font-size:clamp(16px,5vw,28px);font-weight:900">${k.toUpperCase()}</div><div class="lb">${k}</div>`;
d.onclick=()=>{spellBuf+=k;speak(k);rStrip();d.classList.add('pulse');setTimeout(()=>d.classList.remove('pulse'),300)};b.appendChild(d)});
for(let p=row.length;p<10;p++){if(row.length===9&&p===9){const sp=document.createElement('div');sp.className='c core';sp.innerHTML='<div class="lb">⌫</div>';sp.onclick=()=>{spellBuf=spellBuf.slice(0,-1);rStrip()};b.appendChild(sp)}
else if(row.length===7){if(p===7){const sp=document.createElement('div');sp.className='c core';sp.style.background='#2a9d8f';sp.innerHTML='<div class="lb">SPACE</div>';sp.onclick=()=>{const w=spellBuf.trim();if(w){sentence.push({w,i:0});speak(w)}spellBuf='';rStrip()};b.appendChild(sp)}
else if(p===8){const sp=document.createElement('div');sp.className='c core';sp.style.background='#e9c46a';sp.style.color='#333';sp.innerHTML='<div class="lb" style="color:#333">SPEAK</div>';sp.onclick=()=>{if(spellBuf.trim())speak(spellBuf.trim())};b.appendChild(sp)}
else if(p===9){const sp=document.createElement('div');sp.className='c negation';sp.innerHTML='<div class="lb">CLEAR</div>';sp.onclick=()=>{spellBuf='';rStrip()};b.appendChild(sp)}}
else{const e=document.createElement('div');e.className='c';e.style.visibility='hidden';b.appendChild(e)}}});
// number row
'1234567890'.split('').forEach(k=>{const d=document.createElement('div');d.className='c misc';d.style.background='#4a4e69';
d.innerHTML=`<div style="font-size:clamp(14px,4vw,24px);font-weight:900">${k}</div><div class="lb">${k}</div>`;
d.onclick=()=>{spellBuf+=k;speak(k);rStrip();d.classList.add('pulse');setTimeout(()=>d.classList.remove('pulse'),300)};b.appendChild(d)});
}
function getHome(){return V.filter(v=>(!v.lv||v.lv<=LV)).sort((a,b)=>a.p-b.p)}
function getFringe(cat){
const catColors={food:'social',people:'pronoun',feelings:'feeling',places:'prep',animals:'verb',things:'core',colors:'desc',body:'feeling',clothes:'desc'};
return(FR[cat]||[]).map(([w,svgName])=>({w,svgName,i:0,t:catColors[cat]||'noun'}));
}
function getCustom(){return customWords.map(c=>({w:c.w,i:c.i||0,t:c.t||'noun',photo:c.photo||null}))}
function goHome(){curView='home';const w=spellBuf.trim();if(w){sentence.push({w,i:0});speak(w)}spellBuf='';render();rStrip();document.getElementById('backBtn').style.display='none'}

// === RECENTS ===
function renderRec(){const rb=document.getElementById('recentsBar');if(!showRec){rb.style.display='none';return}rb.style.display='flex';rb.innerHTML='';recents.slice(0,8).forEach(s=>{const d=document.createElement('div');d.className='rc';d.innerHTML=`<img src="${IM(s.i)}" onerror="this.style.display='none'"><span>${s.w}</span>`;d.onclick=()=>addWord(s.w,s.i);rb.appendChild(d)})}

// === PIN ===
let pinBuf='';
function openPin(){pinBuf='';document.getElementById('pinErr').textContent='';updDots();document.getElementById('pinOv').classList.add('open')}
function closePin(){document.getElementById('pinOv').classList.remove('open');pinBuf=''}
function pinKey(k){if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);document.getElementById('pinErr').textContent=''}else if(pinBuf.length<4){pinBuf+=k;if(pinBuf.length===4){if(pinBuf===PIN){closePin();openSet()}else{document.getElementById('pinErr').textContent='Wrong PIN';const d=document.getElementById('pinDots');d.classList.add('shake');setTimeout(()=>d.classList.remove('shake'),400);pinBuf=''}}}updDots()}

function renderStats(){const box=document.getElementById('statsBox');const total=Object.values(usage).reduce((a,b)=>a+b,0);const sorted=Object.entries(usage).sort((a,b)=>b[1]-a[1]).slice(0,5);const lvWords=V.filter(v=>!v.lv||v.lv<=LV).filter(v=>!v.cat);const usedLv=lvWords.filter(v=>usage[v.w]>0).length;const pct=lvWords.length?Math.round(usedLv/lvWords.length*100):0;
box.innerHTML=`<div class="stat-row"><span>Total taps</span><b>${total}</b></div><div class="stat-row"><span>Unique words</span><b>${Object.keys(usage).length}</b></div><div class="stat-row"><span>Level ${LV} coverage</span><b>${pct}%</b></div>${sorted.map(([w,c])=>`<div class="stat-row"><span>${w}</span><b>${c}×</b></div>`).join('')}${pct>=70&&LV<3?`<div style="margin-top:6px;padding:6px;background:rgba(42,157,143,.2);border-radius:6px;font-size:.8em">💡 Your child uses ${pct}% of Level ${LV} words. Consider upgrading to Level ${LV+1}!</div>`:''}`}

function renderCWList(){const el=document.getElementById('cwList');if(!customWords.length){el.innerHTML='<p style="font-size:.75em;opacity:.5">No custom words yet</p>';return}el.innerHTML=customWords.map((c,i)=>`<div class="cw-item"><span>${c.w}</span><button class="dn" onclick="delCW(${i})" style="padding:2px 8px;font-size:.7em">✕</button></div>`).join('')}
let cwPhotoData=null;
function handleCWPhoto(input){
if(!input.files||!input.files[0])return;
const file=input.files[0];
const reader=new FileReader();
reader.onload=function(e){
// Resize to 120x120 max for localStorage efficiency
const img=new Image();
img.onload=function(){
const MAX=120;
let w=img.width,h=img.height;
if(w>h){if(w>MAX){h=h*(MAX/w);w=MAX}}else{if(h>MAX){w=w*(MAX/h);h=MAX}}
const canvas=document.createElement('canvas');
canvas.width=w;canvas.height=h;
const ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0,w,h);
cwPhotoData=canvas.toDataURL('image/jpeg',0.8);
document.getElementById('cwPreview').innerHTML=`<img src="${cwPhotoData}" style="width:60px;height:60px;border-radius:8px;object-fit:cover;border:2px solid #2a9d8f"><br><span style="font-size:.65em;color:#aaa">Photo added</span>`;
};
img.src=e.target.result;
};
reader.readAsDataURL(file);
}
function openAddCW(){document.getElementById('cwWord').value='';document.getElementById('cwAra').value='';cwPhotoData=null;document.getElementById('cwPreview').innerHTML='';document.getElementById('cwOv').classList.add('open')}
function saveCW(){const w=document.getElementById('cwWord').value.trim();if(!w)return;const t=document.getElementById('cwCat').value;const ara=document.getElementById('cwAra').value.trim();customWords.push({w,t,i:ara?parseInt(ara):0,photo:cwPhotoData||null});cwPhotoData=null;save();closeOv('cwOv');renderCWList()}

const TUT=[{e:'🗣️',h:'Welcome to My Buddy!',p:'Tap any word to hear it spoken. Build your child\'s language one word at a time.'},{e:'📝',h:'Build Sentences',p:'Tap multiple words to build a sentence. Then press SPEAK to say it all together.'},{e:'⚙️',h:'Parents: Settings',p:'Tap ⚙️ to adjust voice, grid size, vocabulary level, and add custom words. Default PIN: 1234'}];
let tutStep=0;
function showTut(){tutStep=0;rTut();document.getElementById('tutOv').style.display='flex'}
function rTut(){const s=TUT[tutStep];document.getElementById('tutE').textContent=s.e;document.getElementById('tutH').textContent=s.h;document.getElementById('tutP').textContent=s.p;document.getElementById('tutD').innerHTML=TUT.map((_,i)=>`<div class="tut-d ${i===tutStep?'on':''}"></div>`).join('');document.getElementById('tutBtn').textContent=tutStep===TUT.length-1?"Got it! 🚀":"Next"}
function tutNext(){if(tutStep<TUT.length-1){tutStep++;rTut()}else{document.getElementById('tutOv').style.display='none';save()}}

function init(){
const tutDone=load();
document.getElementById('pinPad').innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k===''?'<button class="nk empty"></button>':k==='⌫'?`<button class="nk" onclick="pinKey('⌫')">⌫</button>`:`<button class="nk" onclick="pinKey('${k}')">${k}</button>`).join('');
render();renderRec();

speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=populateVoices;
setTimeout(()=>{const sp=document.getElementById('splash');sp.classList.add('gone');setTimeout(()=>{sp.remove();if(!tutDone)showTut()},500)},800);
}

document.body.insertAdjacentHTML('beforeend','<div class="tut-ov" id="tutOv" style="display:none"><div class="tut-card"><div class="tut-emoji" id="tutE"></div><div class="tut-h" id="tutH"></div><div class="tut-p" id="tutP"></div><div class="tut-dots" id="tutD"></div><button class="tut-btn" id="tutBtn" onclick="tutNext()">Next</button></div></div>');
