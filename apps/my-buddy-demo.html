<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Buddy AAC — Live Demo</title>
<style>
:root{--ink:#1a1f2e}*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d1117;color:#e6edf3;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0f1620;border-bottom:1px solid #263445;flex-wrap:nowrap}
#strip{flex:1;min-height:46px;background:#fff;border-radius:10px;display:flex;align-items:center;gap:5px;padding:5px 8px;overflow-x:auto}
#strip .w{display:flex;flex-direction:column;align-items:center;background:#eef3ff;border:1px solid #c6d4f7;border-radius:7px;padding:2px 7px;color:#1a1f2e;font-weight:700;white-space:nowrap;font-size:.82rem}
#strip .w img{width:22px;height:22px}
#buf{min-width:60px;color:#4a7dff;font-weight:800;font-family:monospace;padding:0 6px;white-space:nowrap}
button{border:0;border-radius:9px;padding:9px 13px;font-weight:800;cursor:pointer;font-size:.85rem;flex-shrink:0}
#speak{background:#4ade80;color:#08240f}#bk{background:#ffe08a}#clr{background:#ff9a9a}
#board{flex:1;display:grid;gap:5px;padding:7px;overflow:hidden}
.tile{border:2px solid rgba(0,0,0,.22);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;user-select:none;padding:3px;overflow:hidden;min-height:0}
.tile:active{transform:scale(.93)}
.tile img{width:min(6vw,40px);height:min(6vw,40px);pointer-events:none}
.tile .lb{font-weight:800;font-size:clamp(.5rem,1.5vw,.8rem);text-align:center;line-height:1;color:#12161f}
.tile.empty{visibility:hidden}
footer{text-align:center;padding:6px;font-size:.72rem;color:#7d8fa3;background:#0f1620}
footer a{color:#4ade80;font-weight:700;text-decoration:none}

/* inline-svg containment: symbols are <svg>, not <img>; without this an
   unsized svg fills its grid cell/strip and can paint over the whole board */
.tile svg{width:min(6vw,40px);height:min(6vw,40px);flex:0 0 auto}
#strip .w svg{width:22px;height:22px;flex:0 0 auto}
.tile,#strip .w{overflow:hidden}
#board svg,#strip svg{max-width:100%;max-height:100%;overflow:hidden}
</style></head>
<body><div id="app">
<header>
  <button id="home" style="background:#263445;color:#e6edf3">⌂</button>
  <div id="strip"><span id="buf"></span></div>
  <button id="speak">🔊</button><button id="bk">⌫</button><button id="clr">Clear</button>
</header>
<div id="board"></div>
<footer>My Buddy AAC — fixed 84-location grid, pronoun sequencing, live grammar &amp; spelling · <a href="https://github.com/bmcgarybot/my-buddy-aac" target="_blank">open source</a></footer>
</div>
<script>
/**
 * My Buddy — Morphology Engine
 *
 * Turns the grammar keys (+S +ING +ED +ER +EST, TO+) into REAL inflected
 * words instead of speaking "walk, ing". Handles English spelling rules and
 * the common irregulars an AAC user actually needs.
 *
 * inflect('run', 'ING')  -> 'running'
 * inflect('make', 'ED')  -> 'made'
 * inflect('go',   'ED')  -> 'went'
 * inflect('big',  'EST') -> 'biggest'
 * inflect('child','S')   -> 'children'
 */

// ── Irregulars (memorized forms; no rule produces these) ──
const IRREGULAR = {
  S: {
    child: 'children', person: 'people', man: 'men', woman: 'women',
    foot: 'feet', tooth: 'teeth', mouse: 'mice', goose: 'geese',
    is: 'are', has: 'have', was: 'were', this: 'these', that: 'those'
  },
  ED: {
    go: 'went', do: 'did', have: 'had', has: 'had', is: 'was', are: 'were',
    am: 'was', make: 'made', get: 'got', give: 'gave', take: 'took',
    come: 'came', see: 'saw', eat: 'ate', drink: 'drank', run: 'ran',
    sit: 'sat', stand: 'stood', find: 'found', think: 'thought',
    feel: 'felt', say: 'said', tell: 'told', know: 'knew', put: 'put',
    read: 'read', let: 'let', hit: 'hit', cut: 'cut', hurt: 'hurt',
    buy: 'bought', bring: 'brought', catch: 'caught', teach: 'taught',
    sleep: 'slept', leave: 'left', lose: 'lost', win: 'won', hold: 'held',
    ride: 'rode', write: 'wrote', drive: 'drove', fly: 'flew', wear: 'wore',
    fall: 'fell', break: 'broke', speak: 'spoke', choose: 'chose',
    swim: 'swam', throw: 'threw', grow: 'grew', draw: 'drew', hear: 'heard',
    build: 'built', send: 'sent', spend: 'spent', keep: 'kept', mean: 'meant'
  },
  ING: {
    // irregular stems for -ing (most are regular; these drop/keep oddly)
    be: 'being', see: 'seeing', flee: 'fleeing'
  },
  ER: { good: 'better', bad: 'worse', far: 'farther', little: 'less', much: 'more' },
  EST: { good: 'best', bad: 'worst', far: 'farthest', little: 'least', much: 'most' }
};

const VOWELS = 'aeiou';
const isVowel = c => VOWELS.indexOf(c) !== -1;

function endsWithCVC(w) {
  // consonant-vowel-consonant, last consonant not w/x/y (for doubling)
  if (w.length < 3) return false;
  const a = w[w.length - 3], b = w[w.length - 2], c = w[w.length - 1];
  return !isVowel(a) && isVowel(b) && !isVowel(c) && 'wxy'.indexOf(c) === -1;
}

function addS(w) {
  if (/[^aeiou]y$/.test(w)) return w.slice(0, -1) + 'ies';      // carry->carries
  if (/(s|sh|ch|x|z)$/.test(w)) return w + 'es';                 // box->boxes
  if (/(f)$/.test(w)) return w.slice(0, -1) + 'ves';             // leaf->leaves
  if (/fe$/.test(w)) return w.slice(0, -2) + 'ves';              // knife->knives
  return w + 's';
}

function addING(w) {
  if (/ie$/.test(w)) return w.slice(0, -2) + 'ying';            // lie->lying
  if (/[^aeiou]e$/.test(w) && w !== 'be') return w.slice(0, -1) + 'ing'; // make->making
  if (endsWithCVC(w)) return w + w[w.length - 1] + 'ing';       // run->running
  return w + 'ing';
}

function addED(w) {
  if (/e$/.test(w)) return w + 'd';                             // like->liked
  if (/[^aeiou]y$/.test(w)) return w.slice(0, -1) + 'ied';      // carry->carried
  if (endsWithCVC(w)) return w + w[w.length - 1] + 'ed';        // stop->stopped
  return w + 'ed';
}

function addER(w) {
  if (/e$/.test(w)) return w + 'r';                             // nice->nicer
  if (/[^aeiou]y$/.test(w)) return w.slice(0, -1) + 'ier';      // happy->happier
  if (endsWithCVC(w)) return w + w[w.length - 1] + 'er';        // big->bigger
  return w + 'er';
}

function addEST(w) {
  if (/e$/.test(w)) return w + 'st';
  if (/[^aeiou]y$/.test(w)) return w.slice(0, -1) + 'iest';
  if (endsWithCVC(w)) return w + w[w.length - 1] + 'est';
  return w + 'est';
}

const RULES = { S: addS, ING: addING, ED: addED, ER: addER, EST: addEST };

/**
 * Inflect a base word by a grammar key.
 * @param {string} word - the base word (may include leading caps)
 * @param {string} key  - one of S, ING, ED, ER, EST, TO
 * @returns {string} the inflected word (TO returns "to <word>")
 */
function inflect(word, key) {
  if (!word) return word;
  const K = String(key).toUpperCase().replace(/[^A-Z]/g, '');
  if (K === 'TO') return 'to ' + word;

  // preserve leading capital
  const cap = word[0] === word[0].toUpperCase() && word[0] !== word[0].toLowerCase();
  const lower = word.toLowerCase();

  let out;
  if (IRREGULAR[K] && IRREGULAR[K][lower]) {
    out = IRREGULAR[K][lower];
  } else if (RULES[K]) {
    out = RULES[K](lower);
  } else {
    out = word; // unknown key: no-op
  }
  return cap ? out[0].toUpperCase() + out.slice(1) : out;
}

/** Map a tile's action string ("+ing","+S","to+") to a rule key, else null. */
function actionToKey(action) {
  if (!action || typeof action !== 'string') return null;
  const a = action.toLowerCase().replace(/[+\s]/g, '');
  const map = { s: 'S', ing: 'ING', ed: 'ED', er: 'ER', est: 'EST', to: 'TO', nt: 'NT' };
  return map[a] || null;
}

/** Apply n't as a contraction on auxiliaries (do->don't, is->isn't...). */
function applyNot(word) {
  if (!word) return word;
  const w = word.toLowerCase();
  const special = {
    will: "won't", can: "can't", shall: "shan't", may: "may not",
    do: "don't", does: "doesn't", did: "didn't", is: "isn't", are: "aren't",
    was: "wasn't", were: "weren't", have: "haven't", has: "hasn't",
    had: "hadn't", would: "wouldn't", could: "couldn't", should: "shouldn't",
    must: "mustn't", might: "might not", am: "am not"
  };
  return special[w] || word + "n't";
}

let cur='root', sentence=[], spell='';
const boardEl=document.getElementById('board'), stripEl=document.getElementById('strip'), bufEl=document.getElementById('buf');
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function renderStrip(){
  [...stripEl.querySelectorAll('.w')].forEach(n=>n.remove());
  sentence.forEach(s=>{const d=document.createElement('span');d.className='w';
    d.innerHTML=(s.img&&SYMBOLS[s.img]?SYMBOLS[s.img]:'')+'<span>'+s.label+'</span>';stripEl.appendChild(d);});
  bufEl.textContent=spell?spell+'\u2588':'';
  stripEl.scrollLeft=stripEl.scrollWidth;
}
function actionToKeyLocal(a){return actionToKey(a);}
function render(){
  const b=BOARDS[cur],g=b.grid;
  boardEl.style.gridTemplateColumns='repeat('+g.columns+',1fr)';
  boardEl.style.gridTemplateRows='repeat('+g.rows+',1fr)';
  boardEl.innerHTML='';
  g.order.flat().forEach(id=>{
    const d=document.createElement('div');
    if(!id||!b.tiles[id]){d.className='tile empty';boardEl.appendChild(d);return;}
    const t=b.tiles[id];d.className='tile';d.style.background=t.color;
    const isLetter=t.action&&t.action.indexOf('spell:')===0&&t.action.length===7;
    if(isLetter){d.innerHTML='<div style="font-size:clamp(1rem,4vw,2rem);font-weight:900;color:#12161f">'+t.label.toUpperCase()+'</div><div class="lb">'+t.label+'</div>';}
    else{d.innerHTML=(t.img&&SYMBOLS[t.img]?SYMBOLS[t.img]:'')+'<div class="lb">'+t.label+'</div>';}
    d.onclick=()=>onTile(t);boardEl.appendChild(d);
  });
}
function lastWordIdx(){for(let i=sentence.length-1;i>=0;i--)if(sentence[i].label)return i;return -1;}
function onTile(t){
  const a=t.action||'';
  if(a.indexOf('spell')===0){
    if(a.indexOf('spell:')===0){spell+=a.slice(6);say(a.slice(6));renderStrip();return;}
    if(a==='spell-space'){const w=spell.trim();if(w){sentence.push({label:w,img:''});say(w);}spell='';renderStrip();return;}
    if(a==='spell-speak'){if(spell.trim())say(spell.trim());return;}
    if(a==='spell-clear'){spell='';renderStrip();return;}
  }
  const mk=actionToKey(a);
  if(mk){const i=lastWordIdx();if(i>=0){const base=sentence[i].label;
    const nw=mk==='NT'?applyNot(base):inflect(base,mk);sentence[i].label=nw;say(nw);renderStrip();}return;}
  if(t.load){cur=t.load;render();return;}
  sentence.push({label:t.label,img:t.img});say(t.label);renderStrip();
}
document.getElementById('home').onclick=()=>{cur='root';render();};
document.getElementById('speak').onclick=()=>say(sentence.map(s=>s.label).join(' ')||'Tap to talk');
document.getElementById('bk').onclick=()=>{if(spell)spell=spell.slice(0,-1);else sentence.pop();renderStrip();};
document.getElementById('clr').onclick=()=>{sentence=[];spell='';renderStrip();};
render();renderStrip();
