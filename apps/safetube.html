<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeTube</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: white; min-height: 100vh; overflow-x: hidden; }

/* ═══ HEADER ═══ */
.header { background: #16213e; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.header h1 { font-size: 24px; color: #4ecca3; }
.header .subtitle { font-size: 13px; color: #a0a0c0; }
.settings-btn { background: none; border: 1px solid #a0a0c0; color: #a0a0c0; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.settings-btn:hover { background: #0f3460; }
.back-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding: 4px 12px 4px 0; }
.shield-badge { background: rgba(78, 204, 163, 0.2); color: #4ecca3; padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; }

/* ═══ CHANNEL GRID ═══ */
.section-header { padding: 20px 24px 8px; display: flex; align-items: center; justify-content: space-between; }
.section-header h2 { font-size: 18px; font-weight: 700; }
.section-header .count { font-size: 13px; color: #a0a0c0; }
.channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; padding: 12px 24px 24px; }
.channel-card { background: #16213e; border: 1px solid rgba(78, 204, 163, 0.3); border-radius: 16px; padding: 24px 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
.channel-card:hover { transform: translateY(-4px); border-color: #4ecca3; box-shadow: 0 8px 24px rgba(78, 204, 163, 0.15); }
.channel-card .emoji { font-size: 48px; margin-bottom: 12px; }
.channel-card .name { font-weight: bold; font-size: 15px; }
.channel-card .vid-count { font-size: 12px; color: #a0a0c0; margin-top: 4px; }

/* ═══ VIDEO BROWSE GRID ═══ */
.channel-banner { display: flex; align-items: center; gap: 16px; padding: 20px 24px; }
.channel-banner .ch-emoji { font-size: 42px; }
.channel-banner .ch-name { font-size: 22px; font-weight: 800; }
.channel-banner .ch-count { font-size: 13px; color: #a0a0c0; margin-top: 2px; }

.toolbar { padding: 0 24px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sort-btn { background: #16213e; border: 1px solid rgba(78, 204, 163, 0.3); color: #a0a0c0; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
.sort-btn:hover, .sort-btn.active { background: #4ecca3; color: #1a1a2e; border-color: #4ecca3; font-weight: 600; }
.search-box { background: #16213e; border: 1px solid rgba(78, 204, 163, 0.3); color: white; padding: 6px 14px; border-radius: 20px; font-size: 13px; outline: none; width: 200px; margin-left: auto; }
.search-box:focus { border-color: #4ecca3; }
.search-box::placeholder { color: #666; }

.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 0 24px 24px; }
.video-card { background: #16213e; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.2s; position: relative; }
.video-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
.video-card .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #0f3460; display: block; }
.video-card .fav-star { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); border: none; font-size: 16px; cursor: pointer; padding: 4px 8px; border-radius: 8px; z-index: 5; }
.video-card .info { padding: 12px 14px; }
.video-card .title { font-size: 14px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; }
.video-card .meta { font-size: 12px; color: #a0a0c0; display: flex; gap: 12px; }

/* ═══ VIDEO PLAYER ═══ */
.player-container { max-width: 960px; margin: 0 auto; padding: 20px 24px; }
.player-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 12px; overflow: hidden; }
.player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
.player-title { font-size: 18px; font-weight: 700; margin-top: 16px; line-height: 1.4; }
.player-meta { font-size: 13px; color: #a0a0c0; margin-top: 6px; }
.player-fav { background: none; border: 1px solid #4ecca3; color: #4ecca3; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-top: 12px; transition: all 0.2s; }
.player-fav.is-fav { background: #4ecca3; color: #1a1a2e; }
.more-videos-header { font-size: 16px; font-weight: 700; margin: 24px 0 12px; }

/* ═══ FAVORITES SECTION ═══ */
.fav-section { padding: 0 24px 12px; }

/* ═══ LOAD MORE ═══ */
.load-more { text-align: center; padding: 16px 24px 32px; }
.load-more button { background: #16213e; border: 1px solid #4ecca3; color: #4ecca3; padding: 12px 32px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; }
.load-more button:hover { background: #4ecca3; color: #1a1a2e; }

/* ═══ LOADING ═══ */
.loading { text-align: center; padding: 60px 24px; }
.loading .spinner { width: 36px; height: 36px; border: 3px solid #16213e; border-top-color: #4ecca3; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading .text { color: #a0a0c0; font-size: 14px; }
.progress-bar { width: 200px; height: 4px; background: #16213e; border-radius: 2px; margin: 12px auto 0; overflow: hidden; }
.progress-fill { height: 100%; background: #4ecca3; border-radius: 2px; transition: width 0.3s; }
.error-msg { text-align: center; padding: 40px; color: #e94560; }

/* ═══ PIN OVERLAY ═══ */
.pin-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #1a1a2e; z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
.pin-dots { display: flex; gap: 12px; margin: 16px 0; }
.pin-dot { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background 0.15s; }
.pin-dot.filled { background: #4ecca3; }
.numpad { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; }
.numpad button { width: 70px; height: 70px; border-radius: 50%; border: none; background: rgba(255,255,255,0.04); color: white; font-size: 24px; font-weight: bold; cursor: pointer; }
.numpad button:hover { background: rgba(255,255,255,0.1); }
.numpad button.empty { visibility: hidden; }

/* ═══ SETTINGS ═══ */
.settings-view { display: none; padding: 24px; max-width: 600px; margin: 0 auto; }
.setting-card { background: #16213e; border-radius: 14px; padding: 18px; margin-bottom: 12px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; }
.toggle { width: 48px; height: 26px; border-radius: 13px; background: #0f3460; position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
.toggle.on { background: #4ecca3; }
.toggle::after { content: ''; width: 22px; height: 22px; border-radius: 50%; background: white; position: absolute; top: 2px; left: 2px; transition: transform 0.2s; }
.toggle.on::after { transform: translateX(22px); }
.save-btn { background: #4ecca3; color: #1a1a2e; border: none; padding: 14px 32px; border-radius: 14px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; margin-top: 24px; }
.save-btn:hover { opacity: 0.9; }
.danger-btn { background: #e94560; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 600px) {
    .channel-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px; }
    .video-grid { grid-template-columns: 1fr; padding: 0 16px 16px; }
    .channel-banner { padding: 16px; }
    .toolbar { padding: 0 16px 12px; }
    .search-box { width: 140px; }
    .player-container { padding: 12px 16px; }
}
</style>
</head>
<body>

<!-- ═══ HOME ═══ -->
<div id="homeView">
    <div class="header">
        <div><h1>🛡️ SafeTube</h1><div class="subtitle">Safe browsing for kids</div></div>
        <button class="settings-btn" onclick="showPinGate()">⚙️ Settings</button>
    </div>
    <div id="favSection" class="fav-section" style="display:none">
        <div class="section-header" style="padding-left:0"><h2>⭐ Favorites</h2><span class="count" id="favCount"></span></div>
        <div class="video-grid" id="favGrid" style="padding:0"></div>
    </div>
    <div class="section-header"><h2>Approved Channels</h2><span class="count" id="channelCount"></span></div>
    <div class="channel-grid" id="channelGrid"></div>
</div>

<!-- ═══ BROWSE ═══ -->
<div id="browseView" style="display:none">
    <div class="header">
        <div style="display:flex;align-items:center;gap:8px;">
            <button class="back-btn" onclick="goHome()">←</button>
            <span style="color:#4ecca3;font-weight:bold;">🛡️ SafeTube</span>
        </div>
        <span class="shield-badge">🛡️ Protected</span>
    </div>
    <div class="channel-banner">
        <div class="ch-emoji" id="browseEmoji"></div>
        <div><div class="ch-name" id="browseName"></div><div class="ch-count" id="browseCount"></div></div>
    </div>
    <div class="toolbar">
        <button class="sort-btn active" data-sort="newest" onclick="sortVideos('newest')">Newest</button>
        <button class="sort-btn" data-sort="oldest" onclick="sortVideos('oldest')">Oldest</button>
        <button class="sort-btn" data-sort="title" onclick="sortVideos('title')">A-Z</button>
        <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search videos..." oninput="filterVideos()">
    </div>
    <div id="browseContent"></div>
</div>

<!-- ═══ PLAYER ═══ -->
<div id="playerView" style="display:none">
    <div class="header">
        <div style="display:flex;align-items:center;gap:8px;">
            <button class="back-btn" onclick="goBackToBrowse()">←</button>
            <span style="color:#4ecca3;font-weight:bold;">🛡️ SafeTube</span>
        </div>
        <span class="shield-badge">🛡️ Protected</span>
    </div>
    <div class="player-container">
        <div class="player-wrapper" id="playerWrapper">
            <div id="ytPlayer"></div>
            <!-- Overlays block YouTube logo (top-left) and "Watch on YouTube" (bottom-right) -->
            <div id="overlayTopLeft" style="position:absolute;top:0;left:0;width:160px;height:50px;z-index:10;cursor:default;"></div>
            <div id="overlayBottomRight" style="position:absolute;bottom:0;right:0;width:200px;height:44px;z-index:10;cursor:default;"></div>
            <div id="overlayTopRight" style="position:absolute;top:0;right:0;width:80px;height:50px;z-index:10;cursor:default;"></div>
            <!-- "Up Next" overlay shown when video ends -->
            <div id="endOverlay" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;border-radius:12px;">
                <div style="font-size:14px;color:#a0a0c0;">Up next...</div>
                <div id="endNextTitle" style="font-size:18px;font-weight:bold;text-align:center;padding:0 24px;"></div>
                <div style="display:flex;gap:12px;margin-top:8px;">
                    <button onclick="playNextVideo()" style="background:#4ecca3;color:#1a1a2e;border:none;padding:12px 28px;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;">▶ Play</button>
                    <button onclick="goBackToBrowse()" style="background:#16213e;color:#a0a0c0;border:1px solid #a0a0c0;padding:12px 20px;border-radius:10px;font-size:14px;cursor:pointer;">Back to Videos</button>
                </div>
            </div>
        </div>
        <div class="player-title" id="playerTitle"></div>
        <div class="player-meta" id="playerMeta"></div>
        <button class="player-fav" id="playerFav" onclick="toggleFavCurrent()">⭐ Add to Favorites</button>
        <div class="more-videos-header">More from this channel</div>
        <div class="video-grid" id="moreVideos"></div>
    </div>
</div>

<!-- ═══ PIN ═══ -->
<div class="pin-overlay" id="pinOverlay">
    <div style="text-align:center">
        <div style="font-size:32px">🔒</div>
        <div style="font-size:22px;font-weight:bold;margin:8px 0">Parent PIN</div>
        <div class="pin-dots" id="pinDots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
        <div id="pinError" style="color:#e94560;font-size:13px;height:20px"></div>
        <div class="numpad" id="numpad"></div>
        <button onclick="closePinOverlay()" style="background:none;border:none;color:#a0a0c0;margin-top:16px;cursor:pointer;font-size:14px;">Cancel</button>
    </div>
</div>

<!-- ═══ SETTINGS ═══ -->
<div class="settings-view" id="settingsView">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <h2>⚙️ Parent Settings</h2>
        <button onclick="saveSettings()" style="background:none;border:none;color:#a0a0c0;font-size:24px;cursor:pointer;">✕</button>
    </div>
    <div class="setting-card">
        <div style="font-weight:600;margin-bottom:8px;">Session Time Limit</div>
        <div style="display:flex;align-items:center;gap:12px;">
            <input type="range" id="sessionSlider" min="10" max="120" step="5" value="30"
                   style="flex:1;accent-color:#4ecca3;" oninput="document.getElementById('sessionVal').textContent=this.value+' min'">
            <span id="sessionVal" style="color:#4ecca3;font-weight:600;min-width:55px;">30 min</span>
        </div>
    </div>
    <div class="setting-card">
        <div style="font-weight:600;margin-bottom:4px;">Video Cache</div>
        <div style="font-size:12px;color:#a0a0c0;margin-bottom:8px;">Cached videos load instantly.</div>
        <div style="font-size:13px;color:#4ecca3;margin-bottom:8px;" id="cacheStats"></div>
        <button class="danger-btn" onclick="clearAllCache()">Clear Cache</button>
    </div>
    <button class="save-btn" onclick="saveSettings()">Save & Close</button>
</div>

<script>
// ═══════════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════════
const API_KEY = 'AIzaSyB5TGP6SsM4EHYJq20yDrShnyJypJThaXU';
const API_BASE = 'https://www.googleapis.com/youtube/v3';

const defaultChannels = [
    // ── Standalone Channels ──
    { name: 'Sesame Street',      handle: '@SesameStreet',       emoji: '🐸' },
    { name: 'Bluey',              handle: '@BlueyOfficialChannel', emoji: '🐕' },
    { name: 'Numberblocks',       handle: '@Numberblocks',       emoji: '🔢' },
    { name: 'Netflix Jr.',        handle: '@netflixjr',          emoji: '🤖' },
    { name: 'Nat Geo Kids',       handle: '@NatGeoKids',         emoji: '🌍' },
    { name: 'Cosmic Kids Yoga',   handle: '@CosmicKidsYoga',     emoji: '🧘' },
    { name: 'SciShow Kids',       handle: '@scishowkids',        emoji: '🔬' },
    { name: 'Art for Kids Hub',   handle: '@ArtforKidsHub',      emoji: '🎨' },
    { name: 'PBS KIDS',           handle: '@PBSKIDS',            emoji: '📺' },
    { name: 'Wild Kratts',        handle: '@WildKratts',         emoji: '🦎' },
    { name: 'Curious George',     handle: '@CuriousGeorge',      emoji: '🐵' },
    { name: 'Super Why',          handle: '@SuperWhy',           emoji: '📖' },
    { name: 'WordWorld',          handle: '@WordWorld',          emoji: '🔤' },
    { name: 'The Singing Walrus', handle: '@TheSingingWalrus',   emoji: '🦭' },
    // ── PBS KIDS Playlists (specific shows) ──
    { name: 'PBS KIDS Movies',    handle: '@PBSKIDS', playlistId: 'PLa8HWWMcQEGTbi5om5BkRD8y7BSIB9BzR', emoji: '🎬' },
    { name: 'Daniel Tiger',       handle: '@PBSKIDS', playlistId: 'PLa8HWWMcQEGTvVi5IkHY526u1YMqM0w7m', emoji: '🐯' },
    { name: 'Xavier Riddle',      handle: '@PBSKIDS', playlistId: 'PLa8HWWMcQEGQGJpeBCGd5Oeaxqibti5Cm', emoji: '🦸' },
    { name: "Alma's Way",         handle: '@PBSKIDS', playlistId: 'PLa8HWWMcQEGTPnXipUupo4caKOzY7a9f6', emoji: '💃' },
    { name: 'Hero Elementary',    handle: '@PBSKIDS', playlistId: 'PLa8HWWMcQEGTTMeqqSyRh8KU975jdGHBr', emoji: '🦸‍♂️' },
    { name: 'Work It Out Wombats',handle: '@PBSKIDS', playlistId: 'PLa8HWWMcQEGTKmx7wb4P-MDfzs5tmcNRW', emoji: '🐨' },
    { name: 'Donkey Hodie',       handle: '@PBSKIDS', playlistId: 'PLa8HWWMcQEGQBlAQFUzJnfZqnvT0nqS0h', emoji: '🫏' },
    { name: 'Molly of Denali',    handle: '@PBSKIDS', playlistId: 'PLPZ40gM7aDFA1nIOkF3upPoyIyjHezUiO', emoji: '🏔️' },
    { name: "Let's Go Luna",      handle: '@PBSKIDS', playlistId: 'PLBCSvaHIzmYLe_brRQ5CL9UvBZ22C1JVl', emoji: '🌙' },
    { name: 'Odd Squad',          handle: '@PBSKIDS', playlistId: 'PLa8HWWMcQEGSWWiIZ419mPtNrsI7dfWXR', emoji: '🔍' },
    { name: 'ASL for Kids',       handle: '@PBSKIDS', playlistId: 'PLa8HWWMcQEGRRX_zhaMmDa5Wusv0aGm_7', emoji: '🧏' },
];

let channels = JSON.parse(localStorage.getItem('st-channels')) || defaultChannels;
let favorites = JSON.parse(localStorage.getItem('st-favorites')) || {};
let currentChannel = null;
let currentChannelIdx = -1;
let currentVideos = [];
let displayedVideos = [];
let currentSort = 'newest';
let searchQuery = '';
let currentPlayingVideo = null;
const DISPLAY_CHUNK = 50; // show 50 at a time for perf
let displayedCount = 0;

const PIN = localStorage.getItem('st-pin') || '1234';
let enteredPin = '';
const CACHE_PREFIX = 'st-cache-';
const CACHE_TTL = 4 * 60 * 60 * 1000;

// ═══════════════════════════════════════════
// API
// ═══════════════════════════════════════════
async function apiGet(endpoint, params) {
    params.key = API_KEY;
    const resp = await fetch(`${API_BASE}/${endpoint}?${new URLSearchParams(params)}`);
    if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e?.error?.message || `API ${resp.status}`); }
    return resp.json();
}

async function resolveChannel(handle) {
    const cached = getCache(handle);
    if (cached?.channelId) return cached;
    const clean = handle.startsWith('@') ? handle.substring(1) : handle;
    const data = await apiGet('channels', { part: 'contentDetails', forHandle: clean });
    if (!data.items?.length) throw new Error(`Channel ${handle} not found`);
    const item = data.items[0];
    const info = { channelId: item.id, uploadsId: item.contentDetails.relatedPlaylists.uploads };
    let cache = getCache(handle) || {};
    Object.assign(cache, info);
    setCache(handle, cache);
    return cache;
}

async function fetchAllVideos(handle, onProgress, playlistId) {
    // If a specific playlistId is provided (e.g. PBS KIDS show playlists), use it directly
    let targetPlaylist;
    if (playlistId) {
        targetPlaylist = playlistId;
    } else {
        const cache = await resolveChannel(handle);
        targetPlaylist = cache.uploadsId;
    }

    // Cache key includes playlistId for playlist-specific entries
    const cacheKey = playlistId ? handle + ':' + playlistId : handle;
    const cached = getCache(cacheKey);
    if (cached?.videos?.length && cached.fetchedAt && (Date.now() - cached.fetchedAt < CACHE_TTL)) {
        return cached.videos;
    }

    let all = [], pageToken = null;
    do {
        const params = { part: 'snippet', playlistId: targetPlaylist, maxResults: '50' };
        if (pageToken) params.pageToken = pageToken;
        const data = await apiGet('playlistItems', params);
        const total = data.pageInfo?.totalResults || 0;
        for (const item of (data.items || [])) {
            const s = item.snippet, vid = s.resourceId?.videoId;
            if (!vid || s.title === 'Private video' || s.title === 'Deleted video') continue;
            all.push({
                id: vid, title: s.title, published: s.publishedAt,
                thumbnail: s.thumbnails?.high?.url || s.thumbnails?.medium?.url || `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`,
                date: new Date(s.publishedAt)
            });
        }
        pageToken = data.nextPageToken || null;
        if (onProgress) onProgress(all.length, total);
        if (pageToken) await new Promise(r => setTimeout(r, 80));
    } while (pageToken);

    let cache = getCache(cacheKey) || {};
    cache.videos = all; cache.fetchedAt = Date.now(); cache.totalVideos = all.length;
    setCache(cacheKey, cache);
    return all;
}

// ═══════════════════════════════════════════
// CACHE
// ═══════════════════════════════════════════
function getCache(h) { try { return JSON.parse(localStorage.getItem(CACHE_PREFIX+h)); } catch { return null; } }
function setCache(h, d) { try { localStorage.setItem(CACHE_PREFIX+h, JSON.stringify(d)); } catch(e) { console.warn('Cache full'); } }
function clearAllCache() {
    channels.forEach(ch => localStorage.removeItem(CACHE_PREFIX + ch.handle));
    updateCacheStats();
    renderChannels();
}
function updateCacheStats() {
    let tv = 0, tb = 0;
    channels.forEach(ch => { const v = localStorage.getItem(CACHE_PREFIX+ch.handle); if (v) { tb += v.length*2; const d = JSON.parse(v); tv += d.totalVideos||0; } });
    document.getElementById('cacheStats').textContent = `${tv.toLocaleString()} videos cached (${(tb/1024/1024).toFixed(1)} MB)`;
}

// ═══════════════════════════════════════════
// FAVORITES
// ═══════════════════════════════════════════
function isFav(id) { return !!favorites[id]; }
function toggleFav(id, title, thumbnail, channelName, dateStr) {
    if (favorites[id]) delete favorites[id]; else favorites[id] = { title, thumbnail, channelName, date: dateStr };
    localStorage.setItem('st-favorites', JSON.stringify(favorites));
}
function renderFavorites() {
    const ids = Object.keys(favorites);
    const sec = document.getElementById('favSection');
    if (!ids.length) { sec.style.display = 'none'; return; }
    sec.style.display = 'block';
    document.getElementById('favCount').textContent = ids.length + ' videos';
    document.getElementById('favGrid').innerHTML = ids.slice(0, 8).map(id => {
        const f = favorites[id];
        return videoCardHTML({ id, title: f.title, thumbnail: f.thumbnail, date: new Date(f.date) }, f.channelName);
    }).join('');
}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
function showView(id) {
    ['homeView','browseView','playerView','settingsView'].forEach(v => document.getElementById(v).style.display='none');
    document.getElementById(id).style.display = 'block';
    window.scrollTo(0, 0);
}
function goHome() { stopPlayer(); renderFavorites(); showView('homeView'); }
function goBackToBrowse() { stopPlayer(); showView('browseView'); }

// ═══════════════════════════════════════════
// HOME
// ═══════════════════════════════════════════
function renderChannels() {
    document.getElementById('channelCount').textContent = channels.length + ' channels';
    document.getElementById('channelGrid').innerHTML = channels.map((ch, i) => {
        const cacheKey = ch.playlistId ? ch.handle + ':' + ch.playlistId : ch.handle;
        const c = getCache(cacheKey);
        const ct = c?.totalVideos ? `${c.totalVideos.toLocaleString()} videos` : '';
        return `<div class="channel-card" onclick="openChannel(${i})">
            <div class="emoji">${ch.emoji}</div><div class="name">${ch.name}</div>
            ${ct ? `<div class="vid-count">${ct}</div>` : ''}
        </div>`;
    }).join('');
}

// ═══════════════════════════════════════════
// BROWSE
// ═══════════════════════════════════════════
async function openChannel(index) {
    currentChannel = channels[index]; currentChannelIdx = index;
    currentSort = 'newest'; searchQuery = '';
    showView('browseView');
    document.getElementById('browseEmoji').textContent = currentChannel.emoji;
    document.getElementById('browseName').textContent = currentChannel.name;
    document.getElementById('browseCount').textContent = 'Loading...';
    document.getElementById('searchBox').value = '';
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.sort-btn[data-sort="newest"]').classList.add('active');

    document.getElementById('browseContent').innerHTML =
        `<div class="loading"><div class="spinner"></div><div class="text" id="loadText">Loading videos...</div>
        <div class="progress-bar"><div class="progress-fill" id="loadProgress" style="width:0%"></div></div></div>`;

    try {
        currentVideos = await fetchAllVideos(currentChannel.handle, (loaded, total) => {
            const pct = total > 0 ? Math.round(loaded/total*100) : 0;
            const el = document.getElementById('loadProgress'), txt = document.getElementById('loadText');
            if (el) el.style.width = pct+'%';
            if (txt) txt.textContent = `Loading ${loaded.toLocaleString()} of ${total.toLocaleString()} videos...`;
        }, currentChannel.playlistId);
        document.getElementById('browseCount').textContent = currentVideos.length.toLocaleString() + ' videos';
        applyFilters();
    } catch (e) {
        document.getElementById('browseCount').textContent = 'Error';
        document.getElementById('browseContent').innerHTML =
            `<div class="error-msg"><div style="font-size:32px;margin-bottom:8px;">😿</div>
            <div>Couldn't load videos</div><div style="font-size:12px;margin-top:8px;opacity:0.7;">${escapeHTML(e.message)}</div>
            <button onclick="openChannel(${index})" style="margin-top:16px;padding:10px 24px;background:#4ecca3;color:#1a1a2e;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">Try Again</button></div>`;
    }
}

function sortVideos(type) {
    currentSort = type;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.sort-btn[data-sort="${type}"]`).classList.add('active');
    applyFilters();
}

function filterVideos() { searchQuery = document.getElementById('searchBox').value.toLowerCase(); applyFilters(); }

function applyFilters() {
    let vids = [...currentVideos];
    if (searchQuery) vids = vids.filter(v => v.title.toLowerCase().includes(searchQuery));
    switch (currentSort) {
        case 'newest': vids.sort((a,b) => b.date - a.date); break;
        case 'oldest': vids.sort((a,b) => a.date - b.date); break;
        case 'title':  vids.sort((a,b) => a.title.localeCompare(b.title)); break;
    }
    displayedVideos = vids;
    displayedCount = 0;
    renderNextChunk(true);
}

function renderNextChunk(reset) {
    const next = displayedVideos.slice(displayedCount, displayedCount + DISPLAY_CHUNK);
    displayedCount += next.length;
    const html = next.map(v => videoCardHTML(v, currentChannel?.name)).join('');
    const container = document.getElementById('browseContent');

    if (reset) {
        container.innerHTML = '<div class="video-grid" id="videoGrid"></div>';
    }
    document.getElementById('videoGrid').insertAdjacentHTML('beforeend', html);

    // Remove old load-more button
    const oldBtn = container.querySelector('.load-more');
    if (oldBtn) oldBtn.remove();

    // Add load more button if there's more
    if (displayedCount < displayedVideos.length) {
        container.insertAdjacentHTML('beforeend',
            `<div class="load-more"><button onclick="renderNextChunk(false)">Load More (${(displayedVideos.length - displayedCount).toLocaleString()} remaining)</button></div>`);
    }

    if (displayedVideos.length === 0) {
        container.innerHTML = '<div class="error-msg"><div style="font-size:32px;margin-bottom:8px;">📭</div>No videos found.</div>';
    }
}

// ═══════════════════════════════════════════
// VIDEO CARD HTML
// ═══════════════════════════════════════════
function videoCardHTML(video, channelName) {
    const dateStr = video.date ? video.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    const star = isFav(video.id) ? '⭐' : '☆';
    return `<div class="video-card" onclick="playVideo('${video.id}')">
        <button class="fav-star" onclick="event.stopPropagation();toggleFavCard('${video.id}','${escapeAttr(video.title)}','${escapeAttr(video.thumbnail)}','${escapeAttr(channelName||'')}','${video.published||''}',this)">${star}</button>
        <img class="thumb" src="${video.thumbnail}" alt="" loading="lazy"
             onerror="this.style.background='#0f3460';this.style.minHeight='160px'">
        <div class="info">
            <div class="title">${escapeHTML(video.title)}</div>
            <div class="meta"><span>${dateStr}</span>${channelName ? '<span>'+escapeHTML(channelName)+'</span>' : ''}</div>
        </div>
    </div>`;
}

function toggleFavCard(id, title, thumb, ch, date, btn) {
    toggleFav(id, title, thumb, ch, date);
    btn.textContent = isFav(id) ? '⭐' : '☆';
}

// ═══════════════════════════════════════════
// PLAYER (YouTube IFrame API)
// ═══════════════════════════════════════════
let ytPlayer = null;
let ytApiReady = false;
let nextVideoId = null;

// Load YouTube IFrame API
const ytScript = document.createElement('script');
ytScript.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytScript);

window.onYouTubeIframeAPIReady = function() { ytApiReady = true; };

function playVideo(videoId) {
    showView('playerView');
    document.getElementById('endOverlay').style.display = 'none';

    // Figure out the next video for auto-advance
    const idx = currentVideos.findIndex(v => v.id === videoId);
    const nextVid = idx >= 0 && idx < currentVideos.length - 1 ? currentVideos[idx + 1] : null;
    nextVideoId = nextVid?.id || null;

    if (ytPlayer && ytApiReady) {
        ytPlayer.loadVideoById(videoId);
    } else if (ytApiReady) {
        ytPlayer = new YT.Player('ytPlayer', {
            videoId: videoId,
            playerVars: {
                rel: 0,               // no external recommendations
                modestbranding: 1,     // minimal branding
                autoplay: 1,
                fs: 1,                 // allow fullscreen
                iv_load_policy: 3,     // no annotations
                playsinline: 1,
                disablekb: 0,          // keyboard controls ok
                controls: 1,           // show play/pause/seek
                cc_load_policy: 1,     // show captions if available
                origin: window.location.origin
            },
            events: {
                onStateChange: onPlayerStateChange
            }
        });
    } else {
        // API not loaded yet, retry in 500ms
        setTimeout(() => playVideo(videoId), 500);
        return;
    }

    const video = currentVideos.find(v => v.id === videoId) ||
                  (favorites[videoId] ? { id: videoId, ...favorites[videoId], date: new Date(favorites[videoId].date) } : null);
    currentPlayingVideo = video;

    if (video) {
        document.getElementById('playerTitle').textContent = video.title || '';
        const dateStr = video.date ? video.date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : '';
        document.getElementById('playerMeta').textContent = [currentChannel?.name || video.channelName, dateStr].filter(Boolean).join(' • ');
    }

    // Favorite button state
    const favBtn = document.getElementById('playerFav');
    if (isFav(videoId)) { favBtn.classList.add('is-fav'); favBtn.textContent = '⭐ Favorited'; }
    else { favBtn.classList.remove('is-fav'); favBtn.textContent = '⭐ Add to Favorites'; }

    // Prep "up next" overlay
    if (nextVid) {
        document.getElementById('endNextTitle').textContent = nextVid.title;
    }

    // More videos
    const others = currentVideos.filter(v => v.id !== videoId).slice(0, 8);
    document.getElementById('moreVideos').innerHTML = others.map(v => videoCardHTML(v, currentChannel?.name)).join('');
}

function onPlayerStateChange(event) {
    // YT.PlayerState.ENDED === 0
    if (event.data === 0) {
        // Video ended — show our "up next" overlay instead of YouTube's suggestions
        if (nextVideoId) {
            document.getElementById('endOverlay').style.display = 'flex';
            // Auto-play next after 5 seconds
            clearTimeout(window._autoNextTimer);
            window._autoNextTimer = setTimeout(() => {
                if (document.getElementById('endOverlay').style.display === 'flex') {
                    playNextVideo();
                }
            }, 5000);
        } else {
            goBackToBrowse();
        }
    }
}

function playNextVideo() {
    document.getElementById('endOverlay').style.display = 'none';
    clearTimeout(window._autoNextTimer);
    if (nextVideoId) playVideo(nextVideoId);
}

function stopPlayer() {
    clearTimeout(window._autoNextTimer);
    if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
        try { ytPlayer.stopVideo(); } catch(e) {}
    }
}

function toggleFavCurrent() {
    if (!currentPlayingVideo) return;
    const v = currentPlayingVideo;
    toggleFav(v.id, v.title, v.thumbnail, currentChannel?.name || v.channelName || '', v.published || v.date?.toISOString() || '');
    const favBtn = document.getElementById('playerFav');
    if (isFav(v.id)) { favBtn.classList.add('is-fav'); favBtn.textContent = '⭐ Favorited'; }
    else { favBtn.classList.remove('is-fav'); favBtn.textContent = '⭐ Add to Favorites'; }
}

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escapeAttr(s) { return (s||'').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

// ═══════════════════════════════════════════
// PIN
// ═══════════════════════════════════════════
function showPinGate() { enteredPin = ''; updatePinDots(); document.getElementById('pinError').textContent = ''; document.getElementById('pinOverlay').style.display = 'flex'; }
function closePinOverlay() { document.getElementById('pinOverlay').style.display = 'none'; }
function updatePinDots() { document.querySelectorAll('.pin-dot').forEach((d,i) => d.classList.toggle('filled', i < enteredPin.length)); }
function handlePinKey(key) {
    if (key === '⌫') { enteredPin = enteredPin.slice(0,-1); document.getElementById('pinError').textContent = ''; }
    else if (enteredPin.length < 4) {
        enteredPin += key;
        if (enteredPin.length === 4) {
            if (enteredPin === PIN) { closePinOverlay(); showSettings(); }
            else { document.getElementById('pinError').textContent = 'Wrong PIN'; enteredPin = ''; }
        }
    }
    updatePinDots();
}

// ═══════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════
function showSettings() { updateCacheStats(); showView('settingsView'); }
function saveSettings() { showView('homeView'); }

// ═══════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        if (document.getElementById('pinOverlay').style.display === 'flex') closePinOverlay();
        else if (document.getElementById('playerView').style.display !== 'none') goBackToBrowse();
        else if (document.getElementById('browseView').style.display !== 'none') goHome();
        else if (document.getElementById('settingsView').style.display !== 'none') saveSettings();
    }
});

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
document.getElementById('numpad').innerHTML = keys.map(k =>
    k === '' ? '<button class="empty"></button>' : `<button onclick="handlePinKey('${k}')">${k}</button>`
).join('');

renderChannels();
renderFavorites();
</script>
</body>
</html>
